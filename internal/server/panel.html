<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>longcat2api · 妙手网关面板</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#242a35; --fg:#e6e9ef; --dim:#8b93a3; --ok:#3ecf8e; --warn:#f5a623; --err:#ff5c5c; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",Segoe UI,sans-serif;
         background:var(--bg); color:var(--fg); }
  .wrap { max-width:1080px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:22px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card .k { color:var(--dim); font-size:12px; }
  .card .v { font-size:20px; font-weight:600; margin-top:4px; word-break:break-all; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line);
          border-radius:12px; overflow:hidden; }
  th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--dim); font-weight:500; background:#1b1f28; }
  tr:last-child td { border-bottom:none; }
  .tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; }
  .ok { background:rgba(62,207,142,.15); color:var(--ok); }
  .warn { background:rgba(245,166,35,.15); color:var(--warn); }
  .err { background:rgba(255,92,92,.15); color:var(--err); }
  .bar { display:flex; gap:8px; margin-bottom:18px; }
  input { flex:1; background:var(--card); border:1px solid var(--line); color:var(--fg);
          padding:9px 12px; border-radius:9px; outline:none; }
  button { background:#2a62ff; color:#fff; border:0; padding:9px 16px; border-radius:9px; cursor:pointer; }
  button.ghost { background:#222834; color:var(--fg); }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--dim); }
  .notice { background:rgba(245,166,35,.12); border:1px solid rgba(245,166,35,.35); color:#f5c76a;
            padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:16px; }
  .notice b { color:#ffd88a; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .chan { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:18px; }
  .chan h3 { margin:0 0 10px; font-size:14px; font-weight:600; }
  .chan .line { display:flex; gap:14px; flex-wrap:wrap; color:var(--dim); font-size:13px; margin-bottom:10px; }
  .chan .line b { color:var(--fg); font-weight:500; }
  textarea { width:100%; min-height:64px; background:#12151b; color:var(--fg); border:1px solid var(--line);
             border-radius:9px; padding:9px 12px; font-family:ui-monospace,Menlo,monospace; font-size:12px; resize:vertical; }
  .msg { margin-top:8px; font-size:13px; }
  .msg.ok { color:var(--ok); } .msg.bad { color:var(--err); }
  .ver { font-size:12px; font-weight:500; color:var(--dim); border:1px solid var(--line);
         border-radius:999px; padding:1px 8px; vertical-align:middle; margin-left:6px; }
  input.bad { border-color:var(--err); box-shadow:0 0 0 3px rgba(255,92,92,.12); }
  .hint { color:var(--dim); font-size:12px; margin-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>longcat2api <span id="ver" class="ver">v?</span></h1>
  <div class="sub">妙手(CatPaw) 客户端 → OpenAI 兼容网关 · 本地运维面板</div>

  <div class="bar">
    <input id="key" type="password" placeholder="API Key（填你在 compose / config.json 里设的 api_key）" autocomplete="off" />
    <button onclick="saveKey()">保存并刷新</button>
    <button class="ghost" onclick="load()">刷新</button>
  </div>

  <div id="hint" class="notice" hidden></div>

  <div class="chan" id="accountCard">
    <h3>妙手账号（LongCat-2.0 通道）</h3>
    <div class="line" id="accLine">读取中…</div>
    <textarea id="msTok" placeholder="粘贴妙手 access token（AgGF…）；也支持带 access-token 头的 cURL，或含 access_token 的 JSON"></textarea>
    <div class="row" style="margin-top:8px">
      <button onclick="importMiaoshou()">校验并导入</button>
    </div>
    <div class="msg" id="msMsg"></div>
  </div>

  <div class="chan" id="chanCard">
    <h3 id="chanTitle">longcat 网页通道（免费 LongCat-2.5）</h3>
    <div class="line" id="chanLine">读取中…</div>
    <div class="line" style="gap:8px">
      <button class="ghost" id="btnOpenLogin" onclick="openLogin()">① 去登录</button>
      <button class="ghost" onclick="pasteCookie()">② 粘贴 Cookie</button>
      <button onclick="saveCookie()">③ 校验并保存</button>
    </div>
    <textarea id="ck" placeholder="登录后：F12 → Network → 任意请求 → Request Headers → 复制整串 Cookie（或对该请求右键 Copy as cURL 整段粘进来）"></textarea>
    <div class="msg" id="ckMsg"></div>
  </div>

  <div class="grid" id="overview"></div>

  <table>
    <thead>
      <tr><th>ID</th><th>账号</th><th>UID</th><th>状态</th><th>在途</th><th>冷却</th><th>最近错误</th></tr>
    </thead>
    <tbody id="accounts"><tr><td colspan="7" class="mono">加载中…</td></tr></tbody>
  </table>

  <div class="hint">
    接口：<span class="mono">POST /v1/chat/completions · GET /v1/models · GET /healthz</span><br/>
    token 过期后执行 <span class="mono">go run ./cmd/login</span> 重新导入即可。
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const LS = "lc_key";

function key() { return localStorage.getItem(LS) || ""; }

function saveKey() {
  const v = $("key").value.trim();
  if (v) localStorage.setItem(LS, v); else localStorage.removeItem(LS);
  hideNotice();
  $("key").classList.remove("bad");
  load();
}

// 支持 /panel?key=xxx 直接进入（方便把带 key 的链接存成书签）
(function bootKey() {
  const u = new URL(location.href);
  const q = u.searchParams.get("key");
  if (q) {
    localStorage.setItem(LS, q.trim());
    u.searchParams.delete("key");
    history.replaceState(null, "", u.pathname + (u.search || "") + u.hash);
  }
  $("key").value = key();
})();

function showNotice(html) {
  const n = $("hint");
  n.innerHTML = html;
  n.hidden = false;
}
function hideNotice() { $("hint").hidden = true; }

function needKeyNotice(extra) {
  $("key").classList.add("bad");
  showNotice(
    `<b>需要 API Key</b>　面板与 /v1 接口用同一个 key 保护（compose 里的 <span class="mono">LONGCAT_API_KEY</span>` +
    ` 或 config.json 里的 <span class="mono">api_key</span>）。` +
    (extra ? `<br>${extra}` : "") +
    `<br>把它填到上面的输入框 → 点「保存并刷新」；也可以直接访问 ` +
    `<span class="mono">/panel?key=你的key</span>（0.1.1+ 支持，会自动记住）。`
  );
  $("key").focus();
}

class AuthError extends Error {}

async function api(path) {
  const r = await fetch(path, { headers: key() ? { Authorization: "Bearer " + key() } : {} });
  if (r.status === 401) throw new AuthError("401");
  if (!r.ok) throw new Error(path + " → HTTP " + r.status);
  return r.json();
}

function card(k, v) { return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

const CH = { status: null };

async function loadChannel() {
  try {
    const [st, accs] = await Promise.all([api("/panel/api/channel"), api("/panel/api/accounts")]);
    CH.status = st;
    CH.accounts = accs;
    const modeTxt = st.mode === "auth" ? "已登录（Cookie 登录态）" : "游客（免登录）";
    const ck = st.has_cookie ? '<b style="color:var(--ok)">已保存 Cookie</b>' : "未保存 Cookie";
    const cool = st.cooldown_left_s > 0 ? `<b style="color:var(--warn)">冷却 ${st.cooldown_left_s}s</b>` : "未限流";
    const host = siteOf(st.login_url) || "longcat.ai";
    const intl = /longcat\.ai$/i.test(host);
    $("chanTitle").textContent = `longcat 网页通道（${intl ? "国际站 · " : "国内站 · "}${host}，免费 LongCat-2.5）`;
    $("btnOpenLogin").textContent = `① 打开 ${host}`;

    $("chanLine").innerHTML =
      `<span>状态：<b>${modeTxt}</b></span><span>${ck}</span><span>${cool}</span>` +
      `<span>模型：<b>${(st.models || []).join(", ") || "-"}</b></span>`;
    const n = (CH.accounts || []).length;
    const healthy = (CH.accounts || []).filter((a) => a.healthy).length;
    $("accLine").innerHTML = n
      ? `<span>账号数：<b>${n}</b>（健康 <b>${healthy}</b>）</span><span>说明：LongCat-2.0 走妙手账号池；LongCat-2.5 的 Cookie 属通道凭据，不在这里</span>`
      : `<span style="color:var(--warn)">还没有妙手账号：粘贴 token 导入，或本机跑 go run ./cmd/login</span>`;
  } catch (e) {
    $("chanLine").textContent = "通道状态读取失败：" + e.message;
  }
}

function siteOf(url) {
  try { return new URL(url).hostname; } catch { return ""; }
}

function openLogin() {
  const u = (CH.status && CH.status.login_url) || "https://longcat.ai/chat";
  window.open(u, "_blank", "noopener");
  setCkMsg(`已打开 ${siteOf(u)}，登录完成后回到这里粘贴 Cookie。`, "");
}

async function pasteCookie() {
  try {
    const t = await navigator.clipboard.readText();
    if (!t.trim()) return setCkMsg("剪贴板是空的", "bad");
    $("ck").value = t.trim();
    setCkMsg("已从剪贴板粘贴，点「校验并保存」。", "");
  } catch {
    setCkMsg("浏览器不允许读剪贴板，请手动 Ctrl/Cmd+V 粘到下面文本框。", "bad");
    $("ck").focus();
  }
}

async function importMiaoshou() {
  const v = $("msTok").value.trim();
  const el = $("msMsg");
  if (!v) { el.className = "msg bad"; el.textContent = "请先粘贴 token"; return; }
  el.className = "msg"; el.textContent = "校验中…";
  try {
    const r = await fetch("/panel/api/accounts/import", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
      body: JSON.stringify({ token: v }),
    });
    const d = await r.json();
    if (!r.ok) {
      el.className = "msg bad";
      el.textContent = d.error ? d.error.message : "HTTP " + r.status;
      return;
    }
    $("msTok").value = "";
    el.className = "msg ok";
    el.textContent = `✅ 已导入：${d.name} (uid ${d.uid})，账号池共 ${d.accounts_total} 个，立即可用`;
    load(); loadChannel();
  } catch (e) {
    el.className = "msg bad";
    el.textContent = "请求失败：" + e.message;
  }
}

function setCkMsg(text, kind) {
  const el = $("ckMsg");
  el.className = "msg " + (kind || "");
  el.textContent = text;
}

async function saveCookie() {
  const v = $("ck").value.trim();
  if (!v) return setCkMsg("请先粘贴 Cookie", "bad");
  setCkMsg("校验中…", "");
  try {
    const r = await fetch("/panel/api/channel/login", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" },
        key() ? { Authorization: "Bearer " + key() } : {}),
      body: JSON.stringify({ cookie: v }),
    });
    const d = await r.json();
    if (!r.ok) {
      setCkMsg(d.error ? d.error.message : ("HTTP " + r.status), "bad");
      return;
    }
    $("ck").value = "";
    setCkMsg(`✅ 登录成功：${d.name} (uid ${d.uid})，已启用登录态（Cookie）` + (d.persisted ? "，并写入配置。" : "（写配置失败，重启后会丢）"), "ok");
    loadChannel();
  } catch (e) {
    setCkMsg("请求失败：" + e.message, "bad");
  }
}

async function load() {
  try {
    const [ov, accs] = await Promise.all([api("/panel/api/overview"), api("/panel/api/accounts")]);
    $("overview").innerHTML = [
      card("妙手账号", `${ov.accounts_ok}/${ov.accounts_total}`),
      card("可用模型", ((ov.models || []).map((m) => m.name).join("<br>")) || esc(ov.model)),
      card("会话服务", `<span class="mono">${esc(ov.chat_base)}</span>`),
      card("事件流服务", `<span class="mono">${esc(ov.stream_base)}</span>`),
    ].join("");
    $("accounts").innerHTML = accs.length ? accs.map(a => `
      <tr>
        <td class="mono">${esc(a.id)}</td>
        <td>${esc(a.name) || "—"}</td>
        <td class="mono">${esc(a.uid) || "—"}</td>
        <td><span class="tag ${a.healthy ? "ok" : a.enabled ? "warn" : "err"}">${a.healthy ? "健康" : a.enabled ? "冷却中" : "已停用"}</span></td>
        <td>${a.in_flight}</td>
        <td>${a.cooldown_left ? a.cooldown_left + "s" : "—"}</td>
        <td class="mono">${esc(a.last_error) || "—"}</td>
      </tr>`).join("") : `<tr><td colspan="7" class="mono">还没有账号，先跑 go run ./cmd/login</td></tr>`;
  } catch (e) {
    if (e instanceof AuthError) {
      // 面板受 api_key 保护：没 key / key 不对 → 引导用户填
      $("overview").innerHTML = "";
      $("accounts").innerHTML = `<tr><td colspan="7" class="mono">等待 API Key…</td></tr>`;
      needKeyNotice(key() ? "当前填的 key 不对，请核对 compose 里的 LONGCAT_API_KEY。" : "");
      return;
    }
    hideNotice();
    $("accounts").innerHTML = `<tr><td colspan="7" class="mono">加载失败：${esc(e.message)}</td></tr>`;
  }
}
async function boot() {
  try {
    const r = await fetch("/healthz");
    const h = await r.json();
    if (h.version) $("ver").textContent = "v" + h.version;
    if (h.api_key_required && !key()) {
      // 还没填 key：直接给提示，不用等 401
      needKeyNotice("");
      $("accounts").innerHTML = `<tr><td colspan="7" class="mono">等待 API Key…</td></tr>`;
      return;
    }
  } catch { /* healthz 挂了就直接试 api */ }
  load();
  loadChannel();
}

boot();
setInterval(load, 15000);
</script>
</body>
</html>
